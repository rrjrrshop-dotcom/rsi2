name: Check recommendation scope controls
on:
  push:
    branches: [verify-recommendation-scopes]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate strategy and scope behavior
        run: npm test
      - name: Install Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Test mobile scope selection and dated breakout details
        run: |
          gate="$RUNNER_TEMP/stocking-visual"
          npm install --prefix "$gate" --no-audit --no-fund playwright@1.62.1
          cp .github/recommendation-scopes-smoke.mjs "$gate/check.mjs"
          node "$gate/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recommendation-scope-screenshots
          path: |
            /tmp/rsi2-scope-major.png
            /tmp/rsi2-scope-all.png
          retention-days: 1
      - name: Verify production source and access control
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          const origin = 'https://rsi2.vercel.app';
          const paths = ['index.html','watchlist-ui.mjs','scores.mjs','score-card.css','assets/scopes/major.webp','assets/scopes/all.webp'];
          for (const path of paths) {
            const expected = await readFile(path);
            const response = await fetch(origin + '/' + path, {signal: AbortSignal.timeout(12000), redirect: 'error'});
            assert.equal(response.status, 200);
            assert.ok(expected.equals(Buffer.from(await response.arrayBuffer())), path + ' differs from deployed asset');
          }
          const result = await fetch(origin + '/api/results', {signal: AbortSignal.timeout(12000)});
          assert.equal(result.status, 401);
          console.log('Production assets match the release. Saved recommendations require the device code.');
          JS
