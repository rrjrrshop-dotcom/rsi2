name: Daily market scan
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 2-6'
permissions:
  contents: read
concurrency:
  group: daily-market-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    # An empty private history needs the one-time 350-session load.
    timeout-minutes: 180
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
      TWILIO_VERIFIED_TO: ${{ secrets.TWILIO_VERIFIED_TO }}
      DOW_CONSTITUENTS_URL: ${{ secrets.DOW_CONSTITUENTS_URL }}
      SP500_CONSTITUENTS_URL: ${{ secrets.SP500_CONSTITUENTS_URL }}
      NASDAQ100_CONSTITUENTS_URL: ${{ secrets.NASDAQ100_CONSTITUENTS_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check for an unpublished close
        id: pending
        run: |
          node --input-type=module <<'JS'
          import {appendFile} from 'node:fs/promises';
          import {marketCache} from './server/market-cache.mjs';
          import {collectionTarget} from './server/trading-calendar.mjs';
          const current = await marketCache().current();
          const target = collectionTarget();
          const pending = !current || current.through < target;
          if (!pending) console.log(`Confirmed close ${current.through} already published`);
          await appendFile(process.env.GITHUB_OUTPUT, `pending=${pending}\n`);
          JS
      - name: Validate
        if: steps.pending.outputs.pending == 'true'
        run: npm test
      - name: Load current index constituents
        if: steps.pending.outputs.pending == 'true'
        run: node scripts/build-universe.mjs universe.json
      - name: Save the market close and calculate recommendations
        if: steps.pending.outputs.pending == 'true'
        run: node scripts/scan.mjs universe.json auto scan-result.json
      - name: Notify registered devices and verified phone
        run: node scripts/notify.mjs
