name: Prepare saved market closes
on:
  push:
    branches: [prepare-saved-market-closes]
permissions:
  contents: read
concurrency:
  group: daily-market-scan
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 155
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      DOW_CONSTITUENTS_URL: ${{ secrets.DOW_CONSTITUENTS_URL }}
      SP500_CONSTITUENTS_URL: ${{ secrets.SP500_CONSTITUENTS_URL }}
      NASDAQ100_CONSTITUENTS_URL: ${{ secrets.NASDAQ100_CONSTITUENTS_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check history collector
        run: npm test
      - name: Read stock and index listings
        run: node scripts/build-universe.mjs universe.json
      - name: Prepare and verify private saved closes
        run: node scripts/scan.mjs universe.json auto scan-result.json
