name: Verify installed app updates
on:
  push:
    branches: [verify-app-updates]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node .github/verify-app-updates.mjs
