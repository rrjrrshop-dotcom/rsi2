name: Verify context strategies
on:
  push:
    branches: [verify-context-strategies]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check watchlist-ui.mjs && node --check personal-alerts-ui.mjs
