name: Verify portfolio review
on:
  push:
    branches: [verify-portfolio-review]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check portfolio-review.mjs && node --check scripts/scan.mjs && node --test server/holdings-import.test.mjs
