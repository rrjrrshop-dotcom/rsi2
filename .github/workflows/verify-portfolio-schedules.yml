name: Verify portfolio and schedules
on:
  push:
    branches: [verify-portfolio-schedules]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check portfolio-review.mjs
