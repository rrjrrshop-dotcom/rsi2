name: Verify Sunday update checks
on:
  push:
    branches: [verify-sunday-updates]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/verify-sunday-updates.mjs
